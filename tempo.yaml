# Grafana Tempo in monolithic mode: every component runs in this one process.
# Reference: https://grafana.com/docs/tempo/latest/configuration/
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# Traces are stored on the data volume.
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Size the Go memory limit from the container memory limit.
memory:
  automemlimit_enabled: true

overrides:
  defaults:
    compaction:
      # Delete traces older than 7 days.
      block_retention: 168h

usage_report:
  reporting_enabled: false
